# The checks a stock GitHub runner can genuinely run.
#
# WHAT IS NOT HERE, AND WHY. The build, the typecheck and the bundle freshness
# gate resolve the `ags` toolchain and the typings generated from it:
#
#   - `@girs/` comes from `ags types` (the AUR package `aylurs-gtk-shell`);
#   - `shim-types/` comes from `npm run gen-shim-types`, which type-resolves the
#     installed ags/gnim shims under /usr/share/ags/js;
#   - every bundle is built by `ags bundle` (common/shell/run.sh);
#   - `npm run check:builds` re-derives each artifact's fingerprint, so it can
#     only answer for artifacts that were built on this machine.
#
# None of that exists on a stock ubuntu runner, so a job pretending to build or
# typecheck here would be a green badge over nothing. The route to a build job is
# an Arch container that installs the AUR package and runs `./setup.sh`; that is a
# much heavier job than this repo's checks justify today. Until then the build is
# verified where it can be: on the machine it targets, with `npm run check` and
# `npm run check:builds`.
#
# The probe tier does run in full, in the `probes` job below: every probe's
# modules import `gi://` namespaces (GLib, Gio, GObject, Gtk, Gdk, GdkPixbuf,
# Pango, cairo, Soup, GUdev) and three of them import the Astal libraries on top,
# so that job runs in an Arch container, builds the AGS CLI from a pinned release
# asset and the Astal libraries from a pinned commit, and then demands the whole
# set — a missing, stale or mismatched toolchain fails the run rather than
# skipping the bundled tier (PROBE_REQUIRE_FULL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No ags, no typings needed: biome and the schema generator are plain Node.
      - run: npm ci
      - name: Lint and format
        run: npx biome check .
      - name: Config schemas match their sources
        run: npm run check:schemas
      # The probes live in their own job: the full set needs the AGS toolchain
      # and the Astal libraries, so it runs in the Arch container below.

  # The whole probe set on the toolchain its bundled half builds through.
  #
  # WHAT THIS JOB OWNS. The container carries the runtime the probe modules
  # import (gjs, GTK4, gtk4-layer-shell, libgudev, libsoup3, Pango, GdkPixbuf);
  # the toolchain step pins everything it fetches — the AGS release asset, the Go
  # toolchain that compiles its CLI, and the astal commit its libraries are built
  # from — and the cache is keyed on those pins. Nothing here fetches a moving
  # target; the gate that would catch a stale pin is the probe run itself.
  probes:
    name: probes
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    env:
      # Bump these together; they are the only place the toolchain moves. Only
      # literals may sit in this block: the `runner` context is not available to
      # a job-level `env`, so the three search paths below it are exported by the
      # step that follows the runtime install instead.
      AGS_VERSION: "3.1.2"
      ASTAL_COMMIT: "67ddc83e0bdbda6de7f6f15e4fbc5d6b9d2d1b18"
      GO_VERSION: "1.24.6"
    steps:
      - uses: actions/checkout@v7
      # The runtime the probe modules import, from the distribution: on Arch each
      # of these is a package, and gtk4-layer-shell is the preload path the AGS
      # wrapper bakes into every probe it builds.
      - name: Install the runtime
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            gjs gtk4 gtk4-layer-shell libgudev libsoup3 pango gdk-pixbuf2 \
            gobject-introspection vala meson ninja nodejs npm git curl
      # Every prefix-relative location a later stage can consult, written once
      # here so that no stage has to discover a variable the way the first two
      # attempts did:
      #
      #   * PKG_CONFIG_PATH — the installed `.pc` files, which gtk4's configure
      #     resolves the io stage's `astal-io-0.1` from;
      #   * XDG_DATA_DIRS — the data directories valac and the introspection
      #     tools walk for `<datadir>/vala/vapi` and `<datadir>/gir-1.0`, which is
      #     how the gtk4 stage finds the Vala binding and GIR the io stage
      #     installed (a `--vapidir` pointing at the source tree does not help);
      #   * LIBRARY_PATH and LD_LIBRARY_PATH — link-time and run-time resolution
      #     of the installed shared objects;
      #   * GI_TYPELIB_PATH — run-time typelib resolution for gjs;
      #   * PATH — the toolchain's own `bin`, whose binary the build step creates.
      #
      # Every value is additive: the distribution's directories stay on each
      # search path, so GTK4, gtk4-layer-shell, Pango and the gjs bindings still
      # resolve. A step-level write is where the runner's temporary directory may
      # be read, which is why this is a step and not the job-level env block.
      - name: Export the toolchain search paths
        run: |
          set -euo pipefail
          astal="$RUNNER_TEMP/toolchain/astal"
          {
            echo "PKG_CONFIG_PATH=$astal/lib/pkgconfig"
            echo "GI_TYPELIB_PATH=$astal/lib/girepository-1.0"
            echo "LD_LIBRARY_PATH=$astal/lib"
            echo "LIBRARY_PATH=$astal/lib"
            echo "XDG_DATA_DIRS=$astal/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"
      - name: Cache the toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: ags-${{ env.AGS_VERSION }}-astal-${{ env.ASTAL_COMMIT }}-go-${{ env.GO_VERSION }}
      # Go, the AGS release asset and the astal libraries: all pinned above, all
      # built into $RUNNER_TEMP/toolchain rather than installed into the system,
      # so the cache holds exactly what the probes need.
      - name: Build the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/toolchain"
          mkdir -p "$root/bin"
          curl -sSfL -o "$RUNNER_TEMP/go.tar.gz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          tar xzf "$RUNNER_TEMP/go.tar.gz" -C "$root"
          # astal-4 links astal-io, so the order matters: io, then gtk4, then the
          # wireplumber typelib (AstalWp) the host transport probe imports.
          git clone --quiet --filter=blob:none https://github.com/Aylur/astal "$RUNNER_TEMP/astal-src"
          git -C "$RUNNER_TEMP/astal-src" checkout --quiet "$ASTAL_COMMIT"
          for lib in lib/astal/io lib/astal/gtk4 lib/wireplumber; do
            name="$(basename "$lib")"
            meson setup --prefix="$root/astal" --buildtype=release \
              "$RUNNER_TEMP/astal-build/$name" "$RUNNER_TEMP/astal-src/$lib"
            ninja -C "$RUNNER_TEMP/astal-build/$name" install
          done
          curl -sSfL -o "$RUNNER_TEMP/ags.tar.gz" \
            "https://github.com/Aylur/ags/releases/download/v${AGS_VERSION}/ags-v${AGS_VERSION}.tar.gz"
          mkdir -p "$root/ags"
          tar xzf "$RUNNER_TEMP/ags.tar.gz" --strip-components=1 -C "$root/ags"
          # The wrapper `ags bundle` writes runs gjs under a fixed preload path,
          # so every path the CLI bakes into it is decided here.
          "$root/go/bin/go" build -C "$root/ags/cli" -mod=vendor -o "$root/bin/ags" \
            -ldflags "-X main.gtk4LayerShell=/usr/lib/libgtk4-layer-shell.so -X main.agsJsPackage=$root/ags -X main.gjs=/usr/bin/gjs -X main.bash=/usr/bin/bash" .
      # On both the built and the cached path: the version the probes are
      # written against, read from the pinned source so a bump above cannot leave
      # a stale expectation behind. Upstream's v3.1.2 asset carries `cli/version`
      # at 3.1.0, which is why the number is read rather than typed. The search
      # paths and `bin` are already on the job (see the export step above).
      - name: Read the pinned toolchain version
        run: |
          set -euo pipefail
          echo "PROBE_AGS_VERSION=$(cat "$RUNNER_TEMP/toolchain/ags/cli/version")" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: |
          set -euo pipefail
          ags --version
          gjs --version
          node --version
      # Every probe, each under its own timeout, and a run that does not execute
      # all of them fails: PROBE_REQUIRE_FULL=1 turns a skipped tier, a missing
      # toolchain and a mismatched ags version into a non-zero exit.
      - name: Probes
        env:
          PROBE_REQUIRE_FULL: "1"
        run: npm run check:probes

  # The generated palette carriers are checked against the palette that produced
  # them. The palette is another repository, so this job checks it out at the
  # revision `scripts/palette/pin.json` pins — a public repository, so the clone
  # needs no credential — and re-renders every carrier with the renderer that
  # palette ships. No ags, no typings: the renderer, the templates and the gate
  # are plain Node 22, and the gate fails the job on a stale carrier, a stale
  # record, or a palette that is not the pinned digest.
  palette:
    name: palette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check out the pinned palette
        run: |
          set -euo pipefail
          url=$(node -p "require('./scripts/palette/pin.json').repository")
          revision=$(node -p "require('./scripts/palette/pin.json').revision")
          git clone --quiet "$url" "$RUNNER_TEMP/house-palette"
          git -C "$RUNNER_TEMP/house-palette" checkout --quiet "$revision"
      - name: Re-render every carrier and compare
        run: HOUSE_PALETTE="$RUNNER_TEMP/house-palette" node scripts/check-palette.mjs

  # Nothing here selects files by extension: this job reads prose and code
  # alike, because the gates that do select by extension never open a markdown
  # file. It answers one question — can a stranger who cloned this anywhere
  # follow every path it names?
  portability:
    name: portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Path references resolve for a stranger
        run: node scripts/check-paths.mjs

  # The style tier (SC2015, SC2016, SC2034 …) is not enforced: the tree carries
  # a set of notes and warnings under it that nobody has been through yet. The
  # error tier is enforced, and it is the tier that catches a script that cannot
  # run at all.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error --format=gcc

  # Two scans, because they answer different questions. The history scan proves
  # what is already committed (and the whole history becomes public at once);
  # the tree scan sees the checkout as a reader would, so a leak is named by CI
  # before it is named by whoever reads the diff.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The history scan reads every commit.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the git history
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1
      - name: Scan the checked-out tree
        run: ./gitleaks dir . --redact --no-banner --exit-code 1

  # The message conventions in CONTRIBUTING.md §Commits, checked at the point they
  # are written. Only the commits this push or pull request adds are read, so an
  # existing history is never re-litigated; merge commits are skipped, because
  # their message is generated rather than authored.
  commits:
    name: commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads a commit range, which needs the commits on both sides.
          fetch-depth: 0
      - name: Commit messages follow the conventions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # The commits this run answers for. A branch's first push has no
          # `before`, so it answers for its head commit alone; a pull request
          # answers for everything between its base and its head.
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$AFTER"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi

          status=0
          checked=0
          fail() {
            printf 'FAIL %s: %s\n' "$1" "$2" >&2
            status=1
          }

          # A range that does not resolve must not read as a clean run.
          commits=$(git log --no-merges --format=%H "$range") || {
            printf 'the commit range %s does not resolve\n' "$range" >&2
            exit 1
          }

          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            checked=$((checked + 1))
            message=$(git log -1 --format=%B "$sha")
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%b "$sha")

            if ! printf '%s\n' "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9./_-]*\))?: [a-z0-9]'; then
              fail "$sha" "subject is not 'type(scope): imperative subject' — $subject"
            fi
            if printf '%s\n' "$subject" | grep -qE '\.$'; then
              fail "$sha" "subject ends with a period — $subject"
            fi
            if [ "${#subject}" -gt 100 ]; then
              fail "$sha" "subject is ${#subject} columns (at most 100)"
            fi

            # The body carries the reason; trailer lines alone are not a body.
            if [ -z "$(printf '%s\n' "$body" | grep -vE '^[A-Za-z][A-Za-z-]*: ' | tr -d '[:space:]')" ]; then
              fail "$sha" "no body: state why the code changed"
            fi

            trailers=$(printf '%s\n' "$body" | git interpret-trailers --parse)
            coauthors=$(printf '%s\n' "$trailers" | grep -c '^Co-Authored-By:' || true)
            if [ "$coauthors" -gt 1 ]; then
              fail "$sha" "$coauthors Co-Authored-By lines: one trailer, never a roster"
            fi
            if [ "$coauthors" -eq 1 ] && ! printf '%s\n' "$trailers" | grep -qE '^Co-Authored-By: Pi \([a-z0-9._-]+\)$'; then
              fail "$sha" "the trailer is not 'Co-Authored-By: Pi (<model-id>)'"
            fi
            if printf '%s\n' "$body" | grep -qiE '^(generated|assisted|written)[- ]?(by|with)'; then
              fail "$sha" "state the work in the body instead of a generated-by line"
            fi

            # A message is permanent: no location that resolves on one machine only.
            if printf '%s\n' "$message" | grep -qE '/(home|Users)/[A-Za-z0-9._-]'; then
              fail "$sha" "message names a home path"
            fi

            printf 'ok   %s  %s\n' "${sha:0:8}" "$subject"
          done <<< "$commits"

          printf '%s commit(s) checked\n' "$checked"
          exit "$status"
