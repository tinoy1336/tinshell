# route-map.conf — instance hosting map for tinshell-route.sh.
#
# Format: <app>=<instance>[,<instance>...]
#   First entry = PRODUCTION instance (cold-started when nothing is live).
#   Later entries = DEV fallbacks (tried while live, never cold-started).
#   Empty-request namespace probe: tinshell-route greps the app name against
#   `ags -i <inst> request ""`.
#
# Each app has its own namespace under its app name (prefixed registration).
# The five shell surfaces are REAL apps now (dock/launcher/notifications/
# keyboard/clipboard) — each with its own island for dev.
#
# To run an app in its own island for development: stop shell, start the
# island (ags run apps/<app>/app.ts or its dev unit) — the router
# falls back to it automatically. To host any combination: build a combo
# instance (createApp aggregating the wanted mounts) and add it here.

# ── the five shell surfaces (real apps) ──
# Production: shell. Dev fallbacks: each surface's own island (max modularity).
dock=shell,dock
launcher=shell,launcher
notifications=shell,notifications
keyboard=shell,keyboard
clipboard=shell,clipboard

# ── apps ──
promptd=shell,promptd
polkit=shell,polkit
notes=shell,notes
files=shell,files
media=shell,media
annotate=shell,annotate
portal=shell,portal

# ── services ──
# The `applets` namespace (the applet OS-call backend) is deliberately absent
# here: the dock HOSTS that backend, so the namespace belongs to whichever
# instance hosts the dock — the shell in production, a dock island in dev. Live
# routing finds it by the namespace scan; it has NO cold-start target (a
# brightness keybind must never spawn a dock).
