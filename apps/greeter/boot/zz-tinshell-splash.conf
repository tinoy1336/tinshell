# Keep amdgpu out of the boot image, so the passphrase screen is drawn on
# simpledrm — which maps the firmware's framebuffer and cannot reprogram the
# panel — instead of on the driver that blanks it.
#
# /etc/dracut.conf.d/eos_amd_amdgpu.conf sets force_drivers+=" amdgpu ". That
# both installs the module into every image and writes rd.driver.pre=amdgpu.
# dracut sources its drop-ins in sorted order, so this file is read after it and
# the bare assignment below discards that list before the omit list is evaluated.
# The value is written as `=` with nothing after it: dracut treats a non-empty
# list as a request to install modules, and a lone space would make it run
# instmods with no module names at all.
#
# omit_drivers then keeps the module out of the hostonly image and the fallback
# image alike. An omit is only discarded for a name that is also in drivers,
# add_drivers or force_drivers, and none of those list it here. amdgpu stays in
# the real root, where udev loads it after the root volume is unlocked, so the
# driver that can blank the panel never owns the screen while the passphrase is
# being asked.
force_drivers=
omit_drivers+=" amdgpu "
