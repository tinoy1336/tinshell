# Put the tinshell boot screen into the initramfs and keep Plymouth out of it.
#
# The splash is a program of this machine's own (module 80tinshell-splash): it takes
# the framebuffer and the console, paints the firmware's frame onto its own
# buffer, commits that buffer to the display, draws the mark and the passphrase
# well over it, and answers the unlock's password request. Plymouth is not
# carried into the boot image at all: it takes the display before it has a
# picture to put in it, so the panel shows an empty buffer.
omit_dracutmodules+=" plymouth "
# Named without its numeric prefix: dracut looks the directory up as
# modules.d/[0-9][0-9]<name> and fails the whole build for a name it cannot
# find.
add_dracutmodules+=" tinshell-splash "
