# /etc/greetd/config.toml — greetd login daemon (replaces plasmalogin).
#
# The greeter is an TINSHELL login screen hosted in a MINIMAL Hyprland compositor
# on VT 1 (user "greeter"). On successful login the compositor exits and
# greetd starts the real session on the next VT; logout respawns the greeter.

[terminal]
vt = 1

[default_session]
# start-hyprland passes everything after "--" to Hyprland (verified: the
# binary's own help). greeter.lua's exec-once runs the TINSHELL bundle then
# dispatches exit. The 2>&1 redirect keeps the boot console CLEAN (Hyprland's
# + start-hyprland's + the app's output would otherwise print on tty1 before
# the greeter maps) while preserving the logs for debugging.
command = "start-hyprland -- -c /etc/greetd/greeter.lua >/tmp/greeter-compositor.log 2>&1"
user = "greeter"
