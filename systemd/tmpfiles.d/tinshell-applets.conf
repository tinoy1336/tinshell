# TINSHELL applets socket directory — installed to /etc/tmpfiles.d/tinshell-applets.conf
# by setup.sh (root section), which substitutes __USER__ with the account that runs
# the session, then applied with
#   systemd-tmpfiles --create /etc/tmpfiles.d/tinshell-applets.conf
#
# The applets backend (hosted by the dock) serves a unix socket here for
# clients that cannot reach its D-Bus service: the pre-login greeter runs as the
# `greeter` user, in its own compositor, outside the session bus and outside
# the session owner's home. /run is a root-owned tmpfs cleared at every boot, so
# the directory is a ROOT artifact re-created by tmpfiles — never a mkdir some
# script runs once.
#
# mode 2750, owner the session account: the backend creates the socket inside, and the
# SETGID bit makes that socket inherit the `tinshell-greeter` group — no chown is
# needed (and the session account could not chown to a group it does not belong to). The
# backend then widens the socket mode to 0660; group write on the socket is what
# lets the greeter connect. 2750 rather than 2770: the group may traverse the
# directory and connect, but may not create or replace files in it — the greeter
# cannot swap the socket for one of its own.
#
# setup.sh's root section creates the group and adds `greeter` to it.
d /run/tinshell 2750 __USER__ tinshell-greeter -
# Repair an existing directory whose mode/owner drifted: tmpfiles' `d` applies
# them only when it creates the directory.
z /run/tinshell 2750 __USER__ tinshell-greeter -
